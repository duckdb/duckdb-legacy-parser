#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  prepare:
    name: Prepare
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-slim' || 'ubuntu-slim' }}
    outputs:
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - name: Detect runners
        id: runners
        uses: duckdb/duckdb-ci/detect-runners@main

  build:
    name: Build extension
    needs: prepare
    uses: duckdb/extension-ci-tools/.github/workflows/build.yml@main
    with:
      groups: |
        main:
          config: extension_config.cmake
          toolchain: main
      runners: ${{ needs.prepare.outputs.runners }}

  duckdb-submodule-version:
    uses: duckdb/extension-ci-tools/.github/workflows/_submodule_version.yml@main

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@main
    needs:
      - duckdb-submodule-version
    with:
      duckdb_version: ${{ needs.duckdb-submodule-version.outputs.version }}
      ci_tools_version: main
      extension_name: legacy_parser
      format_checks: 'format;tidy'
